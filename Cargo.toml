[package]
name = "streamhub"
version = "1.0.0"
edition = "2021"
description = "Native Twitch multistream desktop client for Windows (Rust + egui)"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu", "default_fonts", "clipboard"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libloading = "0.8"
libmpv2 = "7.0.1"
iconflow = { version = "2.1", features = ["pack-lucide"] }
native-tls = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "http2"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros", "io-util", "net"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["native-tls", "handshake"] }
twitch-irc = { version = "6.1.3", default-features = false, features = ["transport-ws-native-tls"] }
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.winres]
# Reservado para iconos/recursos en una fase posterior.
